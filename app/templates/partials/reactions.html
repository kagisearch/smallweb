{% set thumb_cnt = reactions_dict.get('👍', 0) %}
<form action="{{ prefix }}like?{{ qs }}"
      method="post" class="emoji-form">
  <input type="hidden" name="url" value="{{ source_url|default(url, true) }}">
  <input type="hidden" name="emoji" value="👍">
  {% if next_link %}<input type="hidden" name="next" value="{{ next_link }}">{% endif %}
  <button type="submit" class="emoji-badge" title="Like this post">
      <svg class="pixel-heart" width="18" height="16" viewBox="0 0 9 8" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1" y="0" width="2" height="1" fill="#ff3b5c"/><rect x="6" y="0" width="2" height="1" fill="#ff3b5c"/><rect x="0" y="1" width="4" height="1" fill="#ff3b5c"/><rect x="5" y="1" width="4" height="1" fill="#ff3b5c"/><rect x="0" y="2" width="9" height="2" fill="#ff3b5c"/><rect x="1" y="4" width="7" height="1" fill="#ff3b5c"/><rect x="2" y="5" width="5" height="1" fill="#ff3b5c"/><rect x="3" y="6" width="3" height="1" fill="#ff3b5c"/><rect x="4" y="7" width="1" height="1" fill="#ff3b5c"/></svg>{% if thumb_cnt %}<span>{{ thumb_cnt }}</span>{% endif %}
  </button>
</form>

{% for emoji, cnt in reactions_list if emoji != '👍' %}
<form action="{{ prefix }}like?{{ qs }}"
      method="post" class="emoji-form">
  <input type="hidden" name="url" value="{{ source_url|default(url, true) }}">
  <input type="hidden" name="emoji" value="{{ emoji }}">
  {% if next_link %}<input type="hidden" name="next" value="{{ next_link }}">{% endif %}
  <button type="submit" class="emoji-badge" title="Like this post">
      <span>{{ emoji }}</span><span>{{ cnt }}</span>
  </button>
</form>
{% endfor %}
